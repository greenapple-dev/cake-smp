<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake SMP</title>
<link rel="icon" href="Cake.jpeg" type="image/jpeg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     CSS Root Variables & Base Settings
     ========================================================================== */
  :root{
    --bg: #1c1116;
    --frosting-pink: #ff7fab;
    --cream: #fff2df;
    --gold: #f0b93d;
    --mint: #7fe0c4;
    --card-bg: rgba(42, 25, 34, 0.9);
    --card-border: rgba(255,242,223,0.15);
    --text-dim: rgba(255,242,223,0.8);
    --radius: 22px;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --font-display: 'Press Start 2P', monospace;
    --base-font-size: 14px;
  }

  *{box-sizing:border-box;}
  
  html { 
    background-color: var(--bg); 
    min-height: 100%; 
  }
  
  body {
    margin: 0; 
    padding: 0; 
    min-height: 100vh;
    background-color: var(--bg); 
    color: var(--cream);
    font-family: var(--font-display); 
    overflow-x: hidden;
    font-size: var(--base-font-size);
  }

  /* ==========================================================================
     Accessibility Mode Classes
     ========================================================================== */
  body.grayscale-mode { filter: grayscale(100%); }
  body.high-contrast-mode { --bg: #000; --card-bg: #111; --cream: #fff; --mint: #0ff; --frosting-pink: #f0f; }
  body.negative-contrast-mode { filter: invert(100%) hue-rotate(180deg); }
  body.light-bg-mode { --bg: #f0f0f0; --cream: #1a1a1a; --card-bg: rgba(255,255,255,0.9); --text-dim: #444; }
  body.links-underline-mode a, body.links-underline-mode .field-box { text-decoration: underline !important; }
  body.readable-font-mode, body.readable-font-mode * { font-family: 'Inter', sans-serif !important; }

  /* ==========================================================================
     Background Video and Overlays
     ========================================================================== */
  .bg-video {
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh;
    z-index: -2; 
    object-fit: cover; 
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh;
    background: rgba(28, 17, 22, 0.6); 
    z-index: -1; 
    pointer-events: none;
  }

  /* ==========================================================================
     Commands Credits Overlay Section
     ========================================================================== */
  #commandsCreditsOverlay { 
    position: fixed; 
    inset: 0; 
    background: #000; 
    z-index: 9999; 
    display: none; 
    overflow-y: auto; 
    text-align: center; 
    padding: 40px 20px; 
  }
  
  #commandsCreditsOverlay.show { 
    display: block; 
  }
  
  .credits-scroll-container { 
    max-width: 800px; 
    margin: 0 auto; 
    padding-bottom: 50vh; 
    animation: scrollUp 15s linear forwards; 
  }
  
  @keyframes scrollUp { 
    0% { transform: translateY(20vh); } 
    100% { transform: translateY(-100vh); } 
  }
  
  .credits-title { 
    font-size: 2.2rem; 
    margin-bottom: 30px; 
    color: var(--mint); 
    text-shadow: 0 0 20px var(--mint); 
  }
  
  .credits-text { 
    font-size: 1rem; 
    color: #ccc; 
    max-width: 700px; 
    margin: 0 auto 25px auto; 
    padding: 0 20px; 
    line-height: 1.8; 
  }
  
  .credits-section { 
    margin-bottom: 40px; 
  }
  
  .credits-section h3 { 
    color: var(--frosting-pink); 
    font-size: 1.1rem; 
    margin-bottom: 10px; 
  }
  
  .credits-alert {
    color: var(--gold); 
    font-size: 1.1rem; 
    max-width: 800px; 
    margin: 0 auto 40px auto;
    padding: 0 20px; 
    line-height: 1.6; 
    text-shadow: 0 0 10px rgba(240, 185, 61, 0.4);
  }

  /* ==========================================================================
     Main Layout Wrapper & Responsiveness
     ========================================================================== */
  .wrap { 
    position: relative; 
    z-index: 1; 
    max-width: 1180px; 
    margin: 0 auto; 
    padding: 40px 24px 100px 90px; 
    transition: opacity 0.4s ease, transform 0.4s ease; 
  }
  
  .wrap.hidden-view { 
    opacity: 0; 
    transform: scale(0.95); 
    pointer-events: none; 
    visibility: hidden; 
    position: absolute; 
    width: 100%; 
  }

  @media (max-width: 768px) {
    .wrap { padding: 30px 16px 80px 16px; }
    .accessibility-widget { left: 10px; top: 10px; }
  }

  /* ==========================================================================
     Accessibility Widget Styles
     ========================================================================== */
  .accessibility-widget {
    position: fixed; 
    left: 20px; 
    top: 30px; 
    z-index: 1000;
    display: flex; 
    flex-direction: column; 
    align-items: flex-start;
  }
  
  .accessibility-toggle {
    width: 48px; 
    height: 48px; 
    background: #3b5998; 
    border: none; 
    border-radius: 12px;
    color: #fff; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
    transition: transform 0.2s ease, background 0.2s ease;
  }
  
  .accessibility-toggle:hover { 
    transform: scale(1.05); 
    background: #4c6ef5; 
  }
  
  .accessibility-toggle svg { 
    width: 24px; 
    height: 24px; 
    fill: #fff; 
  }

  .accessibility-menu {
    position: absolute; 
    left: 0; 
    top: 58px; 
    background: #ffffff; 
    color: #333;
    border-radius: 12px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
    width: 220px;
    padding: 12px 0; 
    display: none; 
    flex-direction: column; 
    gap: 4px;
    border: 1px solid #ddd; 
    z-index: 1001;
  }
  
  .accessibility-menu.open { 
    display: flex; 
    animation: fadeIn 0.2s ease; 
  }
  
  .accessibility-menu h4 { 
    margin: 0 0 8px 14px; 
    font-size: 11px; 
    color: #333; 
    font-family: 'Inter', sans-serif; 
    font-weight: 700; 
    text-transform: uppercase; 
    letter-spacing: 0.5px; 
  }
  
  .accessibility-btn {
    display: flex; 
    align-items: center; 
    gap: 10px; 
    padding: 8px 14px; 
    background: transparent;
    border: none; 
    width: 100%; 
    text-align: left; 
    font-size: 11px; 
    font-family: 'Inter', sans-serif;
    color: #333; 
    cursor: pointer; 
    transition: background 0.15s ease;
  }
  
  .accessibility-btn:hover { 
    background: #f0f0f0; 
    color: #000; 
  }
  
  .accessibility-btn span { 
    font-size: 14px; 
    width: 18px; 
    text-align: center; 
  }

  /* ==========================================================================
     Header and Branding Styling
     ========================================================================== */
  header.top { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    margin-bottom: 34px; 
    gap: 16px; 
    flex-wrap: wrap; 
  }
  
  .brand { 
    display: flex; 
    align-items: center; 
    gap: 14px; 
  }
  
  .brand-mark {
    width: 52px; 
    height: 52px; 
    border-radius: 14px;
    background: linear-gradient(180deg, #4dc4ff 0%, var(--mint) 100%);
    display: flex; 
    align-items: center; 
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35); 
    position: relative; 
    overflow: hidden; 
    flex-shrink: 0;
    border: 1px solid var(--card-border);
  }
  
  .brand-mark img { 
    width: 70%; 
    height: 70%; 
    object-fit: contain; 
    image-rendering: pixelated; 
  }
  
  .brand-text h1 { 
    font-size: 16px; 
    margin: 0; 
    font-weight: 600; 
    color: var(--cream); 
    text-shadow: 2px 2px 0px rgba(0,0,0,0.8); 
  }
  
  .brand-text p { 
    margin: 6px 0 0; 
    font-size: 10px; 
    color: var(--text-dim); 
  }

  .drip-divider { 
    width: 100%; 
    height: 14px; 
    margin-bottom: 30px; 
    opacity: 0.9; 
  }

  /* ==========================================================================
     Grid Cards Styling
     ========================================================================== */
  .grid { 
    display: grid; 
    grid-template-columns: repeat(4, 1fr); 
    grid-auto-rows: 180px; 
    gap: 18px; 
  }

  .card {
    position: relative; 
    border-radius: var(--radius); 
    overflow: hidden;
    background: var(--card-bg); 
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    cursor: pointer;
  }
  
  .card:hover { 
    transform: translateY(-4px); 
    box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
  }

  .card-icon {
    grid-column: span 1; 
    grid-row: span 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%), url('Cakelogo.png');
    background-size: cover; 
    background-position: center; 
    background-repeat: no-repeat;
  }
  
  .card-icon:hover { 
    transform: translateY(-6px) scale(1.01); 
  }

  .card-store {
    grid-column: span 1; 
    grid-row: span 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('store_icon.png');
    background-size: cover; 
    background-position: center; 
    background-repeat: no-repeat;
  }
  
  .card-store:hover { 
    transform: translateY(-6px) scale(1.01); 
  }

  .card-stats {
    grid-column: span 2; 
    grid-row: span 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), url('StatsIcon.png');
    background-size: cover; 
    background-position: center; 
    background-repeat: no-repeat;
  }
  
  .card-stats:hover { 
    transform: translateY(-6px) scale(1.01); 
  }

  .card-ai {
    grid-column: span 2; 
    grid-row: span 1;
    background: linear-gradient(135deg, rgba(77, 196, 255, 0.25) 0%, rgba(127, 224, 196, 0.25) 100%), var(--card-bg);
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    padding: 20px;
    border: 1px solid var(--mint);
  }
  
  .card-ai:hover { 
    transform: translateY(-6px) scale(1.01); 
    border-color: #fff; 
  }

  .card-join-guide {
    grid-column: span 2; 
    grid-row: span 1;
    background: linear-gradient(135deg, rgba(255, 127, 171, 0.25) 0%, rgba(240, 185, 61, 0.25) 100%), var(--card-bg);
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    padding: 20px;
    border: 1px solid var(--frosting-pink);
  }
  
  .card-join-guide:hover { 
    transform: translateY(-6px) scale(1.01); 
    border-color: #fff; 
  }

  .card-countdown {
    grid-column: span 4; 
    grid-row: span 1;
    min-height: 150px; 
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    padding: 22px 28px;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%), url('end_fight.png');
    background-size: cover; 
    background-position: center; 
    background-repeat: no-repeat;
    flex-wrap: wrap; 
    gap: 16px;
  }

  .card-content-over {
    position: absolute; 
    inset: 0; 
    padding: 20px;
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    z-index: 2; 
    pointer-events: none;
  }

  .media-label {
    font-size: 16px; 
    color: #fff; 
    font-weight: bold;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
  }

  .card-discord { 
    grid-column: span 1; 
    grid-row: span 2; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    padding: 18px; 
    gap: 6px; 
    background: rgba(42, 25, 34, 0.9); 
    backdrop-filter: blur(8px); 
    cursor: default;
  }
  
  .card-discord:hover {
    transform: translateY(-4px);
  }

  @media (max-width: 880px){
    .grid { grid-template-columns: repeat(2,1fr); }
    .card-icon, .card-store, .card-discord, .card-stats, .card-ai, .card-join-guide { grid-column: span 2; grid-row: auto; min-height: 180px; }
    .card-countdown { grid-column: span 2; }
  }

  .discord-icon { 
    width: 42px; 
    height: 42px; 
    margin-bottom: 4px; 
    transition: transform 0.3s ease; 
  }
  
  .card-discord:hover .discord-icon { 
    transform: scale(1.15) rotate(5deg); 
  }

  .discord-count { 
    font-size: 16px; 
    font-weight: 600; 
    color: #fff; 
    text-shadow: 2px 2px 0px rgba(0,0,0,0.8); 
  }
  
  .discord-sub { 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    font-size: 10px; 
    color: var(--text-dim); 
  }
  
  .dot-live { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    background: var(--mint); 
    box-shadow: 0 0 8px var(--mint); 
  }
  
  .discord-join { 
    margin-top: 8px; 
    font-size: 10px; 
    color: var(--frosting-pink); 
    text-decoration: none; 
    font-weight: 600; 
    transition: transform 0.2s ease, color 0.2s ease; 
    display: inline-block; 
  }
  
  .discord-join:hover { 
    transform: translateX(4px); 
    color: #ff9ec2; 
  }

  /* Countdown Sub-components */
  .cd-left { 
    display: flex; 
    flex-direction: column; 
    gap: 4px; 
  }
  
  .cd-title { 
    font-size: 14px; 
    font-weight: 600; 
    color: #fff; 
    text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
  }
  
  .cd-sub { 
    font-size: 10px; 
    color: var(--cream); 
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9); 
  }
  
  .cd-timer { 
    display: flex; 
    gap: 12px; 
  }
  
  .cd-unit { 
    background: rgba(0,0,0,0.6); 
    border: 1px solid rgba(255,255,255,0.2); 
    border-radius: 14px; 
    padding: 10px 14px; 
    text-align: center; 
    min-width: 68px; 
    transition: transform 0.2s ease; 
  }
  
  .cd-unit:hover { 
    transform: translateY(-2px); 
    border-color: var(--mint); 
  }
  
  .cd-unit .num { 
    font-size: 14px; 
    font-weight: 600; 
    color: #fff; 
    text-shadow: 2px 2px 0px rgba(0,0,0,0.8); 
  }
  
  .cd-unit .lbl { 
    font-size: 8px; 
    letter-spacing: 1px; 
    color: var(--text-dim); 
    text-transform: uppercase; 
    margin-top: 4px; 
  }

  footer { 
    text-align: center; 
    margin-top: 40px; 
    font-size: 10px; 
    color: var(--text-dim); 
    text-shadow: 1px 1px 0px rgba(0,0,0,0.8); 
  }

  /* ==========================================================================
     Fullscreen Modal Frames Styling
     ========================================================================== */
  .fullscreen-frame {
    position: fixed; 
    inset: 0; 
    margin: auto;
    width: 90%; 
    max-width: 1050px; 
    max-height: 85vh;
    background: rgba(30, 18, 24, 0.96); 
    border: 2px solid var(--card-border);
    border-radius: var(--radius); 
    padding: 40px 50px; 
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px); 
    overflow-y: auto;
    opacity: 0; 
    transform: scale(0.95); 
    pointer-events: none; 
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    display: flex; 
    flex-direction: column;
  }
  
  .fullscreen-frame.active {
    opacity: 1; 
    transform: scale(1); 
    pointer-events: auto; 
    visibility: visible;
  }

  .back-btn {
    display: inline-flex; 
    align-items: center; 
    gap: 8px;
    background: rgba(0, 0, 0, 0.6); 
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--cream); 
    padding: 10px 16px; 
    border-radius: 12px;
    font-size: 11px; 
    cursor: pointer; 
    align-self: flex-start;
    transition: all 0.2s ease; 
    margin-bottom: 20px; 
    text-decoration: none;
  }
  
  .back-btn:hover {
    background: rgba(255, 255, 255, 0.15); 
    border-color: var(--mint); 
    transform: translateX(-4px);
    color: var(--mint);
  }

  .frame-content h2 {
    font-size: 24px; 
    color: #fff; 
    margin: 0 0 16px 0;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
  }
  
  .frame-content p {
    font-size: 13px; 
    line-height: 1.8; 
    color: var(--cream); 
    margin: 0 0 14px 0;
  }
  
  .stats-online-badge {
    display: inline-block; 
    background: rgba(127, 224, 196, 0.15); 
    border: 2px solid var(--mint);
    color: var(--mint); 
    font-size: 13px; 
    padding: 10px 18px;
    border-radius: 12px; 
    margin-bottom: 20px; 
    box-shadow: 0 0 20px rgba(127, 224, 196, 0.2);
  }

  /* AI Assistant Options Grid Inside Modal */
  .ai-options-grid {
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
    gap: 12px; 
    margin: 20px 0;
  }
  
  .ai-opt-btn {
    background: rgba(255, 255, 255, 0.08); 
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 14px 16px; 
    border-radius: 12px; 
    color: var(--cream); 
    font-family: var(--font-display);
    font-size: 10px; 
    cursor: pointer; 
    text-align: left; 
    transition: all 0.2s ease;
  }
  
  .ai-opt-btn:hover { 
    background: var(--mint); 
    color: #000; 
    border-color: var(--mint); 
    transform: translateY(-2px); 
  }
  
  .ai-response-box {
    background: rgba(0, 0, 0, 0.5); 
    border: 1px solid var(--card-border);
    border-radius: 14px; 
    padding: 20px; 
    margin-top: 20px; 
    min-height: 90px;
    font-family: 'Inter', sans-serif; 
    font-size: 14px; 
    color: #fff; 
    line-height: 1.6;
  }

  .coming-soon-container { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    padding: 30px 0; 
    gap: 15px; 
    text-align: center; 
  }
  
  .coming-soon-img { 
    width: 80px; 
    height: 80px; 
    image-rendering: pixelated; 
    animation: bounce 1.5s infinite ease-in-out; 
  }
  
  @keyframes bounce { 
    0%, 100% { transform: translateY(0); } 
    50% { transform: translateY(-10px); } 
  }

  .toast { 
    position: fixed; 
    bottom: 24px; 
    left: 50%; 
    transform: translateX(-50%) translateY(20px); 
    background: #2a1922; 
    border: 1px solid var(--card-border); 
    padding: 12px 20px; 
    border-radius: 12px; 
    font-size: 11px; 
    font-weight: 600; 
    opacity: 0; 
    pointer-events: none; 
    transition: all .25s ease; 
    z-index: 200; 
    box-shadow: var(--shadow); 
  }
  
  .toast.show { 
    opacity: 1; 
    transform: translateX(-50%) translateY(0); 
  }
</style>
</head>
<body>

<!-- Accessibility Widget Element -->
<div class="accessibility-widget" id="accessibilityWidget">
  <button class="accessibility-toggle" id="accessibilityToggle" aria-label="Accessibility Tools">
    <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 1 0 2 2 2 2 0 0 0-2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18z"/></svg>
  </button>
  <div class="accessibility-menu" id="accessibilityMenu">
    <h4>Accessibility Tools</h4>
    <button class="accessibility-btn" id="toolIncreaseText"><span>🔍</span> Increase Text</button>
    <button class="accessibility-btn" id="toolDecreaseText"><span>🔎</span> Decrease Text</button>
    <button class="accessibility-btn" id="toolGrayscale"><span>⬛</span> Grayscale</button>
    <button class="accessibility-btn" id="toolHighContrast"><span>◐</span> High Contrast</button>
    <button class="accessibility-btn" id="toolNegativeContrast"><span>👁</span> Negative Contrast</button>
    <button class="accessibility-btn" id="toolLightBg"><span>💡</span> Light Background</button>
    <button class="accessibility-btn" id="toolLinksUnderline"><span>🔗</span> Links Underline</button>
    <button class="accessibility-btn" id="toolReadableFont"><span>🅰</span> Readable Font</button>
    <button class="accessibility-btn" id="toolReset"><span>↺</span> Reset</button>
  </div>
</div>

<!-- Commands Credits Overlay Screen -->
<div id="commandsCreditsOverlay">
  <div class="credits-scroll-container">
    <h1 class="credits-title
