<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake SMP</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#1c1116; --cream:#fff2df; --mint:#7fe0c4; --frosting-pink:#ff7fab; --card-bg:rgba(42, 25, 34, 0.85); --card-border:rgba(255,242,223,0.12); --font-display:'Press Start 2P', monospace; }
  body { margin:0; background:var(--bg); color:var(--cream); font-family:'Inter', sans-serif; overflow-x:hidden; }
  
  /* Background Video */
  .bg-video { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-2; object-fit:cover; }
  .bg-overlay { position:fixed; inset:0; background:rgba(28,17,22,0.6); z-index:-1; }

  /* Event Credits */
  #creditsOverlay { position:fixed; inset:0; background:#000; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; opacity:0; transition:opacity 2s; }
  #creditsOverlay.show { display:flex; opacity:1; }
  .credits-title { font-family:var(--font-display); font-size:3rem; margin-bottom:20px; color:var(--mint); text-shadow:0 0 20px var(--mint); }
  .credits-text { font-size:1.2rem; color:#ccc; max-width:600px; padding:20px; line-height:1.6; font-family:'Inter', sans-serif; }

  /* Konfete */
  .confetti { position:absolute; width:12px; height:12px; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

  /* Kartice */
  .wrap { max-width:1180px; margin:0 auto; padding:40px 24px; position:relative; z-index:1; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:18px; }
  .card { border-radius:22px; padding:22px; background:var(--card-bg); border:1px solid var(--card-border); position:relative; overflow:hidden; }
  .card-countdown { grid-column: span 4; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%), url('end_fight.png'); background-size:cover; background-position:center; min-height:150px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .cd-title { font-family:var(--font-display); font-size:18px; text-shadow:2px 2px 4px #000; }
  .cd-timer { display:flex; gap:12px; }
  .cd-unit { background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; text-align:center; min-width:60px; }
  .num { font-family:var(--font-display); font-size:16px; }
</style>
</head>
<body>

<div id="creditsOverlay">
  <div id="confettiContainer"></div>
  <h1 class="credits-title">Cake SMP</h1>
  <p class="credits-text">This event is part of normal vanilla lifecycle. The server is resetting for new adventures. Thank you for playing!</p>
</div>

<video class="bg-video" autoplay muted loop playsinline><source src="back.mp4" type="video/mp4"></video>
<div class="bg-overlay"></div>

<div class="wrap">
  <div class="grid">
    <div class="card card-countdown">
      <div>
        <div class="cd-title">End fight</div>
      </div>
      <div class="cd-timer" id="cdTimer">
        <div class="cd-unit"><div class="num" id="cdDays">00</div><div class="lbl">days</div></div>
        <div class="cd-unit"><div class="num" id="cdHours">00</div><div class="lbl">hrs</div></div>
        <div class="cd-unit"><div class="num" id="cdMins">00</div><div class="lbl">min</div></div>
        <div class="cd-unit"><div class="num" id="cdSecs">00</div><div class="lbl">sec</div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // PROBA: Podesio na 00:58:00
  const targetTime = new Date();
  targetTime.setHours(0, 58, 0, 0);

  function createConfetti() {
    const container = document.getElementById('confettiContainer');
    for(let i=0; i<150; i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = (Math.random() * 3 + 2) + 's';
      c.style.backgroundColor = ['#ff7fab', '#f0b93d', '#7fe0c4'][Math.floor(Math.random()*3)];
      container.appendChild(c);
    }
  }

  function update() {
    const now = new Date();
    const diff = targetTime - now;

    if(diff <= 0) {
      document.getElementById('creditsOverlay').classList.add('show');
      if(!document.getElementById('confettiContainer').hasChildNodes()) createConfetti();
      return;
    }

    const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const m = Math.floor((diff % (1000*60*60)) / (1000*60));
    const s = Math.floor((diff % (1000*60)) / 1000);
    
    document.getElementById('cdHours').textContent = String(h).padStart(2,'0');
    document.getElementById('cdMins').textContent = String(m).padStart(2,'0');
    document.getElementById('cdSecs').textContent = String(s).padStart(2,'0');
  }
  
  setInterval(update, 1000);
  update();
})();
</script>
</body>
</html>
